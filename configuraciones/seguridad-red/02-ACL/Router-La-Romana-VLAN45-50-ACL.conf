-----------------------------------------
Router La Romana - VLAN 45 (Contabilidad) y VLAN 50 (Finanzas)
-----------------------------------------

enable
configure terminal

ip access-list extended ACL-CONTABILIDAD-ROMANA
 remark Permitir acceso a servidores Santiago
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 53
 permit udp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 53
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 80
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 443
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 25
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 110
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 143
 permit udp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 1812
 permit udp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 eq 1813
 permit tcp 192.168.6.128 0.0.0.63 192.168.4.0 0.0.0.255 range 20 21
 remark Permitir ICMP para pruebas de conectividad
 permit icmp 192.168.6.128 0.0.0.63 any echo
 permit icmp 192.168.6.128 0.0.0.63 any echo-reply
 remark Bloquear acceso a otros departamentos de la empresa
 deny ip 192.168.6.128 0.0.0.63 192.168.0.0 0.0.3.255
 deny ip 192.168.6.128 0.0.0.63 192.168.5.0 0.0.0.255
 deny ip 192.168.6.128 0.0.0.63 192.168.6.0 0.0.0.63
 deny ip 192.168.6.128 0.0.0.63 192.168.6.192 0.0.0.63
 deny ip 192.168.6.128 0.0.0.63 192.168.7.0 0.0.0.255
 deny ip 192.168.6.128 0.0.0.63 192.168.8.0 0.0.0.255
 remark Permitir el resto del trafico
 permit ip any any
exit

ip access-list extended ACL-FINANZAS-ROMANA
 remark Permitir acceso a servidores Santiago
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 53
 permit udp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 53
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 80
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 443
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 25
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 110
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 143
 permit udp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 1812
 permit udp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 eq 1813
 permit tcp 192.168.6.192 0.0.0.63 192.168.4.0 0.0.0.255 range 20 21
 remark Permitir ICMP para pruebas de conectividad
 permit icmp 192.168.6.192 0.0.0.63 any echo
 permit icmp 192.168.6.192 0.0.0.63 any echo-reply
 remark Bloquear acceso a otros departamentos de la empresa
 deny ip 192.168.6.192 0.0.0.63 192.168.0.0 0.0.3.255
 deny ip 192.168.6.192 0.0.0.63 192.168.5.0 0.0.0.255
 deny ip 192.168.6.192 0.0.0.63 192.168.6.0 0.0.0.63
 deny ip 192.168.6.192 0.0.0.63 192.168.6.128 0.0.0.63
 deny ip 192.168.6.192 0.0.0.63 192.168.7.0 0.0.0.255
 deny ip 192.168.6.192 0.0.0.63 192.168.8.0 0.0.0.255
 remark Permitir el resto del trafico
 permit ip any any
exit

interface e0/0.45
 ip access-group ACL-CONTABILIDAD-ROMANA in
exit
interface e0/0.50
 ip access-group ACL-FINANZAS-ROMANA in
exit

end
write memory
